<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facebook - Security Alert</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .header { background-color: #1877f2; padding: 15px; text-align: center; }
        .header img { height: 40px; }
        .content { padding: 25px; text-align: center; color: #1c1e21; }
        .btn { display: inline-block; background-color: #1877f2; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; }
        .footer { background-color: #f7f7f7; padding: 15px; text-align: center; font-size: 12px; color: #606770; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook Logo">
        </div>
        <div class="content">
            <h2>Confirm Your Login</h2>
            <p>We noticed a new login attempt from an unrecognized device. To secure your account, please verify your identity immediately.</p>
            <a href="YOUR_PHISHING_LINK_HERE" class="btn">Confirm Device</a>
            <p style="font-size: 13px; color: #606770; margin-top: 20px;">If you didn't request this, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; Meta Platforms, Inc. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
